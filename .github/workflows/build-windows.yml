name: Build Windows x64 and ARM64

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    env:
      PYTHONPATH: src
      QT_QPA_PLATFORM: offscreen
      KGSS_BUILD_NAME: K-GSS_${{ github.ref_name }}_windows-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: ${{ matrix.arch }}
      - name: Install dependencies
        run: python -m pip install --upgrade pip pyinstaller .
      - name: Verify native Python architecture
        shell: pwsh
        run: |
          $actual = python -c "import platform; print(platform.machine().lower())"
          Write-Host "Python architecture: $actual"
          if ("${{ matrix.arch }}" -eq "arm64" -and $actual -notmatch "arm64|aarch64") { throw "ARM64 Python was not selected" }
          if ("${{ matrix.arch }}" -eq "x64" -and $actual -notmatch "amd64|x86_64") { throw "x64 Python was not selected" }
      - name: Run tests
        run: python -m unittest tests.test_engine tests.test_khcm2013 tests.test_screening tests.test_ui tests.test_updater tests.test_file_association -q
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean interchange_review.spec
      - name: Verify executable architecture and hash
        shell: pwsh
        run: |
          $exe = Get-Item "dist\$env:KGSS_BUILD_NAME.exe"
          $bytes = [IO.File]::ReadAllBytes($exe.FullName)
          $pe = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $pe + 4)
          $expected = if ("${{ matrix.arch }}" -eq "arm64") { 0xAA64 } else { 0x8664 }
          if ($machine -ne $expected) { throw ("Unexpected PE architecture: 0x{0:X4}" -f $machine) }
          Get-FileHash -Algorithm SHA256 $exe.FullName
          if ("${{ matrix.arch }}" -eq "x64") {
            Copy-Item $exe.FullName "dist\K-GSS_${{ github.ref_name }}.exe"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: dist/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release/*.exe \
            --title "K-GSS ${GITHUB_REF_NAME}" \
            --generate-notes
