[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "korean-guidelines-grade-separation-screening"
version = "3.5.1"
description = "Korean guidelines-based traffic volume and capacity screening for intersection grade separation"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8"]

[project.gui-scripts]
interchange-review = "interchange_review.app:main"

[tool.setuptools.packages.find]
where = ["src"]
